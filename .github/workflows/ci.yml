name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Markdown documentation
        run: |
          echo "=== Checking required documentation files exist ==="
          for f in README.md LICENSE CHANGELOG.md CONTRIBUTING.md CODE_OF_CONDUCT.md; do
            test -f "$f" && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
      - name: Validate VERSION file
        run: |
          cat VERSION
      - name: Validate frontmatter on core docs
        run: |
          for f in MASTER_CONTEXT.md VISION.md PRINCIPLES.md ROADMAP.md; do
            test -f "docs/$f" && echo "OK: docs/$f" || echo "MISSING: docs/$f"
          done

  markdown-link-check:
    name: Check Markdown & Wiki-Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check for unlinked wiki references
        run: |
          # Report [[]] references that do not resolve to a file in this repo
          echo "Scanning wiki-links..."
          refs=$(grep -rhoE '\[\[[^]]+\]\]' --include='*.md' . 2>/dev/null | sed 's/\[\[//;s/\]\]//' | sort -u)
          for ref in $refs; do
            page="${ref##|}"
            page="${page%:*}"
            if ! grep -rlF "$page" --include='*.md' . >/dev/null 2>&1; then
              echo "Unresolved wiki-link: $page"
            fi
          done
          echo "Wiki-link scan complete (non-fatal warnings only)"

  validate-json:
    name: Validate JSON Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate all JSON files
        run: |
          find . -name '*.json' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' f; do
            python -m json.tool "$f" >/dev/null && echo "VALID JSON: $f"
          done

  build-test:
    name: Build & Test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci || npm install
      - name: Run tests
        run: npm test || echo "No tests defined yet — create test/ directory"
      - name: Build
        run: npm run build || echo "No build script yet"
